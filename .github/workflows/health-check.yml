name: health-check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Secrets: gitleaks with its default rules (the workspace's shared config lives in agent-core, absent here),
      # pinned by version and by the SHA-256 of the linux_x64 tarball (value from gitleaks_8.30.1_checksums.txt of the
      # official release).
      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          ./gitleaks dir . --redact --no-banner
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r tools/requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/health_check.py --strict
      # The validator ai/repo-map.json declares: a pull request that breaks the site fails here, not after the merge.
      - run: sh tools/jekyll_build.sh

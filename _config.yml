title: ABAP Craft
description: Architecture notes from real SAP PM and ABAP systems.
baseurl: "/ABAP_Keyflow"
url: "https://nor001.github.io"
lang: en

remote_theme: pages-themes/cayman@v0.2.0
# Stock GitHub Pages plugins, at the versions the pinned jekyll-build-pages image ships.
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

show_downloads: false
google_analytics:

permalink: /:categories/:year/:month/:day/:title/

markdown: kramdown
highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      author: Norman Neri

author:
  name: Norman Neri
  github: nor001

# The control plane is not part of the public site (nor of its sitemap).
exclude:
  - README.md
  - AGENTS.md
  - abap-craft.code-workspace
  - ai
  - prompts
  - tests
  - tools
